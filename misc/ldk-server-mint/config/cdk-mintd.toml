[info]
url = "https://mint.hedwig.sh/"
listen_host = "127.0.0.1"
listen_port = 3338
enable_info_page = true

[info.quote_ttl]
mint_ttl = 600
melt_ttl = 120

[info.logging]
output = "both"
console_level = "info"
file_level = "debug"

[mint_info]
name = "Hedwig Cashu Mint"
description = "Hedwig Cashu mint backed by LDK Server"
description_long = "A Cashu mint for Hedwig backed by an external LDK Server Lightning node."
motd = "Welcome to the Hedwig Cashu mint."
contact_email = "info@hedwig.sh"

[database]
engine = "sqlite"

[ln]
ln_backend = "ldk-server"
unit = "sat"
min_mint = 1
max_mint = 100000
min_melt = 1
max_melt = 100000

[ldk_server]
# CDK_MINTD_LDK_SERVER_ADDRESS and CDK_MINTD_LDK_SERVER_API_KEY are injected
# by compose so secrets do not live in this file.
address = ""
api_key = ""
cert_path = "/run/secrets/ldk_server_tls_crt"
fee_percent = 0.02
reserve_fee_min = 2
max_payment_scan_pages = 32
